<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arduino Control Panel - LED & Motor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>
                <span class="icon">⚡</span>
                Arduino Control Panel
            </h1>
            <p class="subtitle">LED & Motor Controller</p>
        </header>

        <main>
            <!-- LED Controls Section -->
            <section class="control-section">
                <h2 class="section-title">
                    <span class="icon-small">💡</span>
                    LED Controls
                </h2>
                <div class="controls-grid">
                    <!-- LED 1 -->
                    <div class="control-card" data-device="led" data-id="1">
                        <div class="card-header">
                            <h3>LED 1</h3>
                            <div class="status-indicator" data-led="1">
                                <span class="status-dot"></span>
                                <span class="status-text">OFF</span>
                            </div>
                        </div>
                        <div class="card-body">
                            <div class="toggle-group">
                                <button class="btn btn-off active" data-action="off" data-led="1">OFF</button>
                                <button class="btn btn-on" data-action="on" data-led="1">ON</button>
                            </div>
                            <div class="slider-group">
                                <label>Brightness</label>
                                <input type="range" class="brightness-slider" min="0" max="255" value="0" data-led="1">
                                <span class="slider-value">0</span>
                            </div>
                        </div>
                    </div>

                    <!-- LED 2 -->
                    <div class="control-card" data-device="led" data-id="2">
                        <div class="card-header">
                            <h3>LED 2</h3>
                            <div class="status-indicator" data-led="2">
                                <span class="status-dot"></span>
                                <span class="status-text">OFF</span>
                            </div>
                        </div>
                        <div class="card-body">
                            <div class="toggle-group">
                                <button class="btn btn-off active" data-action="off" data-led="2">OFF</button>
                                <button class="btn btn-on" data-action="on" data-led="2">ON</button>
                            </div>
                            <div class="slider-group">
                                <label>Brightness</label>
                                <input type="range" class="brightness-slider" min="0" max="255" value="0" data-led="2">
                                <span class="slider-value">0</span>
                            </div>
                        </div>
                    </div>

                    <!-- LED 3 -->
                    <div class="control-card" data-device="led" data-id="3">
                        <div class="card-header">
                            <h3>LED 3</h3>
                            <div class="status-indicator" data-led="3">
                                <span class="status-dot"></span>
                                <span class="status-text">OFF</span>
                            </div>
                        </div>
                        <div class="card-body">
                            <div class="toggle-group">
                                <button class="btn btn-off active" data-action="off" data-led="3">OFF</button>
                                <button class="btn btn-on" data-action="on" data-led="3">ON</button>
                            </div>
                            <div class="slider-group">
                                <label>Brightness</label>
                                <input type="range" class="brightness-slider" min="0" max="255" value="0" data-led="3">
                                <span class="slider-value">0</span>
                            </div>
                        </div>
                    </div>

                    <!-- LED 4 -->
                    <div class="control-card" data-device="led" data-id="4">
                        <div class="card-header">
                            <h3>LED 4</h3>
                            <div class="status-indicator" data-led="4">
                                <span class="status-dot"></span>
                                <span class="status-text">OFF</span>
                            </div>
                        </div>
                        <div class="card-body">
                            <div class="toggle-group">
                                <button class="btn btn-off active" data-action="off" data-led="4">OFF</button>
                                <button class="btn btn-on" data-action="on" data-led="4">ON</button>
                            </div>
                            <div class="slider-group">
                                <label>Brightness</label>
                                <input type="range" class="brightness-slider" min="0" max="255" value="0" data-led="4">
                                <span class="slider-value">0</span>
                            </div>
                        </div>
                    </div>

                    <!-- LED 5 -->
                    <div class="control-card" data-device="led" data-id="5">
                        <div class="card-header">
                            <h3>LED 5</h3>
                            <div class="status-indicator" data-led="5">
                                <span class="status-dot"></span>
                                <span class="status-text">OFF</span>
                            </div>
                        </div>
                        <div class="card-body">
                            <div class="toggle-group">
                                <button class="btn btn-off active" data-action="off" data-led="5">OFF</button>
                                <button class="btn btn-on" data-action="on" data-led="5">ON</button>
                            </div>
                            <div class="slider-group">
                                <label>Brightness</label>
                                <input type="range" class="brightness-slider" min="0" max="255" value="0" data-led="5">
                                <span class="slider-value">0</span>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Motor Control Section -->
            <section class="control-section">
                <h2 class="section-title">
                    <span class="icon-small">⚙️</span>
                    Motor Control
                </h2>
                <div class="controls-grid motor-grid">
                    <div class="control-card motor-card" data-device="motor">
                        <div class="card-header">
                            <h3>DC Motor</h3>
                            <div class="status-indicator" data-motor="1">
                                <span class="status-dot"></span>
                                <span class="status-text">OFF</span>
                            </div>
                        </div>
                        <div class="card-body">
                            <div class="toggle-group">
                                <button class="btn btn-off active" data-action="off" data-motor="1">OFF</button>
                                <button class="btn btn-on" data-action="on" data-motor="1">ON</button>
                            </div>
                            <div class="slider-group">
                                <label>Speed</label>
                                <input type="range" class="speed-slider" min="0" max="255" value="0" data-motor="1">
                                <span class="slider-value">0</span>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Activity Log Section -->
            <section class="log-section">
                <h2 class="section-title">
                    <span class="icon-small">📋</span>
                    Activity Log
                </h2>
                <div class="log-container">
                    <div id="activityLog" class="log-entries">
                        <p class="log-empty">No activity yet...</p>
                    </div>
                </div>
            </section>
        </main>

        <footer>
            <p>Arduino R4 WiFi Control System • <span id="connectionStatus">Connecting...</span></p>
        </footer>
    </div>

    <script src="js/app.js"></script>
</body>

</html>
